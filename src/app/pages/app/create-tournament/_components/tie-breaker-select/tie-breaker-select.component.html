<div class="flex flex-col text-start w-full">
    <label class="mb-1 text-gray-950 font-medium">
        Critério de desempate
        @if(required) { <span class="text-red-600">*</span>}
    </label>
    <select 
        [name]="name" 
        [id]="name"
        [disabled]="disabled"
        [value]="value"
        (change)="handleSelect($event)"
        (blur)="onTouched()"
        class="border border-gray-300 bg-white rounded-[0.5rem] p-1
        focus:outline-none focus:ring transition-all
        disabled:bg-gray-300 disabled:text-gray-500 disabled:cursor-not-allowed"    
    >
        <option value="">Selecione um valor</option>
        <option value="teste1">Teste 1</option>
    </select>
    <div class="text-sm text-yellow-600 mt-1">
        {{ errorMessage }}
    </div>
</div>
