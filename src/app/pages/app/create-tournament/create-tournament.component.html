<div class="flex flex-wrap">
    <div class="w-full">
        <h1 class="text-3xl">Criar Torneio</h1>
        <form [formGroup]="formData" (ngSubmit)="handleSubmit()">
            <div class="flex flex-wrap gap-4">
                <div class="w-full">
                    <app-input label="Nome" type="text" formControlName="name" placeholder="Digite o nome do torneio"
                        [required]="true"></app-input>
                </div>
            </div>
            <div formGroupName="tournamentSpec" class="flex flex-wrap">
                <div class="w-full sm:w-1/2 md:w-1/3">
                    <app-win-condition-select [required]="true"
                        formControlName="winConditionId"></app-win-condition-select>
                </div>
                <div class="w-full sm:w-1/2 md:w-1/3">
                    <app-type-select [required]="true" formControlName="typeId"></app-type-select>
                </div>
                @if(typeId === "2"){
                <div class="w-full sm:w-1/2 md:w-1/3">
                    <app-tie-breaker-select [required]="true" formControlName="tieBreakerId"></app-tie-breaker-select>
                </div>
                <div class="w-full sm:w-1/2 md:w-1/3">
                    <app-input label="Duração da Partida" type="time" placeholder="Digite a duração da partida"
                        [required]="true" formControlName="matchDuration"></app-input>
                </div>
                <div class="w-full sm:w-1/2 md:w-1/3">
                    <app-input label="Pontos por vitória" type="number"
                        placeholder="Digite a quantidade de pontos após vitória" [required]="true"
                        formControlName="pointsPerWin"></app-input>
                </div>
                <div class="w-full sm:w-1/2 md:w-1/3">
                    <app-input label="Pontos por empate" type="number"
                        placeholder="Digite a quantidade de pontos após empate" [required]="true"
                        formControlName="pointsPerDraw"></app-input>
                </div>
                <div class="w-full sm:w-1/2 md:w-1/3">
                    <app-input label="Pontos por derrota" type="number"
                        placeholder="Digite a quantidade de pontos após derrota" [required]="true"
                        formControlName="pointsPerLose"></app-input>
                </div>
                <div class="w-full sm:w-1/2 md:w-1/3">
                    <app-input label="Quantidade de Rounds" type="number"
                        placeholder="Digite a quantidade de rounds para definição do primeiro lugar" [required]="true"
                        formControlName="qtyRounds"></app-input>
                </div>
                <div class="w-full sm:w-1/2 md:w-1/3">
                    <app-input label="Quantidade de Grupos" type="number" placeholder="Digite a quantidade de grupos"
                        [required]="true" formControlName="qtyGroups"></app-input>
                </div>
                }
            </div>
            <div formArrayName="players" class="flex flex-wrap">
                <div class="w-full">
                    <h4 class="text-2xl">Jogadores</h4>
                    <app-button type="button" variant="success" (click)="addPlayer()">+</app-button>
                </div>
                @for(player of playersArray.controls; track player){
                <div [formGroupName]="$index" class="w-full sm:w-1/2 lg:w-1/3">
                    <div class="flex flex-row w-full">
                        <div class="w-10/12">
                            <app-input formControlName="name" label="Nome do Jogador" [required]="true"
                                placeholder="Digite o nome do jogador"></app-input>
                        </div>
                        <div class="w-2/12 mt-6 ml-1 mr-1">
                            <app-button type="button" variant="danger" (click)="removePlayer($index)">-</app-button>
                        </div>
                    </div>
                </div>
                }
            </div>
            <div class="flex flex-wrap mt-2">
                <div class="w-full">
                    <app-button type="submit" [disabled]="disableForm">Salvar</app-button>
                </div>
            </div>
        </form>
    </div>
</div>
