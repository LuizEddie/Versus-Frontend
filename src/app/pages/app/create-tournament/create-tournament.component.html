<app-row>
    <app-col>
        <div class="p-4 bg-white rounded-lg min-h-screen">
            <h1 class="text-3xl">Criar Torneio</h1>
            <form [formGroup]="formData" (ngSubmit)="handleSubmit()">
                <app-row>
                    <app-col>
                        <app-input label="Nome" type="text" formControlName="name"
                            placeholder="Digite o nome do torneio" [required]="true"></app-input>
                    </app-col>
                </app-row>
                <div formGroupName="tournamentSpec">
                    <app-row>
                        <app-col [sm]="6" [md]="4">
                            <app-type-select [required]="true" formControlName="typeId"></app-type-select>
                        </app-col>
                        @if(typeId === "1"){
                        <app-col [sm]="6" [md]="4">
                            <app-win-condition-select [required]="true"
                                formControlName="winConditionId"></app-win-condition-select>
                        </app-col>
                        }
                    </app-row>
                </div>
                <div formArrayName="players" class="mt-2">
                    <app-row>
                        <app-col>
                            <div class="flex flex-row">
                                <h4 class="text-2xl mr-1">Jogadores</h4>
                                <app-button type="button" variant="success" (click)="addPlayer()">+</app-button>
                            </div>
                        </app-col>
                    </app-row>
                    <app-row>
                        @for(player of playersArray.controls; track player){
                        <app-col [sm]="6" [lg]="4" [xl]="3">
                            <div [formGroupName]="$index" class="flex flex-row">
                                <div class="w-10/12">
                                    <app-input formControlName="name" label="Nome do Jogador" [required]="true"
                                        placeholder="Digite o nome do jogador"></app-input>
                                </div>
                                @if(playersArray.length > 2){
                                <div class="w-2/12 mt-6 ml-1 mr-1">
                                    <app-button type="button" variant="danger"
                                        (click)="removePlayer($index)">-</app-button>
                                </div>
                                }
                            </div>
                        </app-col>
                        }
                    </app-row>
                </div>
                <app-row>
                    <app-col>
                        <app-button type="submit" [disabled]="disableForm">Salvar</app-button>
                    </app-col>
                </app-row>
            </form>
        </div>
    </app-col>
</app-row>
