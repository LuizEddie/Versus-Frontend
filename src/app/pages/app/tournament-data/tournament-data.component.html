<app-row>
    <app-col>
        <app-tabs>
            <app-tab label="Dados" [active]="true">

                <app-row>
                    <app-col>
                        <form [formGroup]="formData" (ngSubmit)="handleSubmit()">
                            <app-row>
                                <app-col>
                                    <app-input label="Nome" type="text" formControlName="name"
                                        placeholder="Digite o nome do torneio" [required]="true"></app-input>
                                </app-col>
                            </app-row>
                            <div formGroupName="tournamentSpec">
                                <app-row>
                                    <app-col [sm]="6" [md]="4">
                                        <app-win-condition-select [required]="true"
                                            formControlName="winConditionId"></app-win-condition-select>
                                    </app-col>
                                    <app-col [sm]="6" [md]="4">
                                        <app-type-select [required]="true" formControlName="typeId"></app-type-select>
                                    </app-col>
                                    <app-col [sm]="6" [md]="4">
                                        <app-tie-breaker-select [required]="true" formControlName="tieBreakerId"
                                            [hidden]="typeId !== 2"></app-tie-breaker-select>
                                    </app-col>
                                    <app-col [sm]="6" [md]="4">
                                        <app-input label="Duração da Partida" type="time"
                                            placeholder="Digite a duração da partida" [required]="true"
                                            formControlName="matchDuration" [hidden]="typeId !== 2"></app-input>
                                    </app-col>
                                    <app-col [sm]="6" [md]="4">
                                        <app-input label="Pontos por vitória" type="number"
                                            placeholder="Digite a quantidade de pontos após vitória" [required]="true"
                                            formControlName="pointsPerWin" [hidden]="typeId !== 2"></app-input>
                                    </app-col>
                                    <app-col [sm]="6" [md]="4">
                                        <app-input label="Pontos por empate" type="number"
                                            placeholder="Digite a quantidade de pontos após empate" [required]="true"
                                            formControlName="pointsPerDraw" [hidden]="typeId !== 2"></app-input>
                                    </app-col>
                                    <app-col [sm]="6" [md]="4">
                                        <app-input label="Pontos por derrota" type="number"
                                            placeholder="Digite a quantidade de pontos após derrota" [required]="true"
                                            formControlName="pointsPerLose" [hidden]="typeId !== 2"></app-input>
                                    </app-col>
                                    <app-col [sm]="6" [md]="4">
                                        <app-input label="Quantidade de Rounds" type="number"
                                            placeholder="Digite a quantidade de rounds para definição do primeiro lugar"
                                            [required]="true" formControlName="qtyRounds"
                                            [hidden]="typeId !== 2"></app-input>
                                    </app-col>
                                    <app-col [sm]="6" [md]="4">
                                        <app-input label="Quantidade de Grupos" type="number"
                                            placeholder="Digite a quantidade de grupos" [required]="true"
                                            formControlName="qtyGroups" [hidden]="typeId !== 2"></app-input>
                                    </app-col>
                                </app-row>
                            </div>
                            <div formArrayName="players" class="mt-2">
                                <app-row>
                                    <app-col>
                                        <div class="flex flex-row">
                                            <h4 class="text-2xl mr-1">Jogadores</h4>
                                            <app-button type="button" variant="success"
                                                (click)="addPlayer()">+</app-button>
                                        </div>
                                    </app-col>
                                </app-row>
                                <app-row>
                                    @for(player of playersArray.controls; track player){
                                    <app-col [sm]="6" [lg]="4" [xl]="3">
                                        <div [formGroupName]="$index" class="flex flex-row">
                                            <div class="w-10/12">
                                                <app-input formControlName="name" label="Nome do Jogador"
                                                    [required]="true"
                                                    placeholder="Digite o nome do jogador"></app-input>
                                            </div>
                                            @if(playersArray.length > 2){
                                            <div class="w-2/12 mt-6 ml-1 mr-1">
                                                <app-button type="button" variant="danger"
                                                    (click)="removePlayer($index)">-</app-button>
                                            </div>
                                            }

                                        </div>
                                    </app-col>
                                    }
                                </app-row>
                            </div>
                            <app-row>
                                <app-col>
                                    <app-button type="submit" [disabled]="disableForm">Salvar</app-button>
                                </app-col>
                            </app-row>
                        </form>
                    </app-col>
                </app-row>
            </app-tab>
            <app-tab label="Pontos">
                Pontos
            </app-tab>
            <app-tab label="Chaves">
                Chaves
                <div class="overflow-x-auto">
                </div>
            </app-tab>
        </app-tabs>
    </app-col>
</app-row>
