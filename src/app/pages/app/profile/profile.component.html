<div class="p-4 bg-white rounded-lg min-h-screen">
    <app-row>
        <app-col sm="12" class="flex justify-center">
            <img alt="Perfil" class="w-75 h-75 rounded-full border border-gray-300 cursor-pointer"
                [src]="profileImage || defaultImg" (click)="fileInput.openFileDialog()" />
        </app-col>
        <app-input #fileInput type="file" accept="image/png, image/jpeg, image/jpg" class="hidden"
            (fileChange)="fileChangeEvent($event)"></app-input>
    </app-row>
    <app-row>
        <app-col sm="12">
            <hr>
        </app-col>
        <app-col sm="12">
            <form [formGroup]="formData" (ngSubmit)="handleUpdateUserData()">
                <app-row>
                    <app-col sm="12">
                        <h1 class="text-2xl mb-2">Dados do Usuário</h1>
                    </app-col>
                    <app-col lg="6">
                        <app-input label="Email" formControlName="email" [readOnly]="true"></app-input>
                    </app-col>
                    <app-col lg="6">
                        <app-input label="Nome" formControlName="name"></app-input>
                    </app-col>
                    <app-col sm="12">
                        <app-button type="submit" [disabled]="disableForm">Salvar Alterações</app-button>
                    </app-col>
                </app-row>
            </form>
        </app-col>
        <app-col sm="12">
            <hr>
        </app-col>
        <app-col sm="12">
            <app-row>
                <app-col sm="12">
                    <h1 class="text-2xl mb-2">Outras Opções</h1>
                </app-col>
                <app-col sm="6" lg="3">
                    <app-button variant="warning" [swal]="globalLogoutSwal">Logout Global</app-button>
                </app-col>
                <app-col sm="6" lg="3">
                    <app-button variant="warning">Atualizar Senha</app-button>
                </app-col>
                <app-col sm="6" lg="3">
                    <app-button variant="danger" [swal]="deactivateAccountSwal">Desativar Conta</app-button>
                </app-col>
                <app-col sm="6" lg="3">
                    <app-button variant="danger" [swal]="deleteAccountSwal">Excluir Conta</app-button>
                </app-col>
            </app-row>
        </app-col>
    </app-row>
    <swal #cropperSwal title="Ajustar Imagem de Perfil" (didOpen)="onSwalOpen()" [showCancelButton]="true"
        [showConfirmButton]="true" confirmButtonText="Atualizar Imagem" cancelButtonText="Cancelar">
        <div *swalPortal="swalTargets.content">
            <app-row>
                <app-col sm="12" class="flex justify-center">
                    <div class="w-[320px] h-[320]">
                        <image-cropper [imageChangedEvent]="imageChangedEvent" [maintainAspectRatio]="true"
                            [aspectRatio]="1" [resizeToWidth]="300" output="blob" format="png" [roundCropper]="true"
                            (imageCropped)="imageCropped($event)"></image-cropper>
                    </div>
                    <app-input #fileInput type="file" accept="image/png, image/jpeg, image/jpg" class="hidden"
                        (fileChange)="fileChangeEvent($event)"></app-input>
                </app-col>
            </app-row>
        </div>
    </swal>
    <swal #deactivateAccountSwal title="Desativar Conta?"
        text="Esta ação pode ser desfeita caso você clique em esqueci a senha na tela de login! Deseja continuar?"
        [showCancelButton]="true" cancelButtonText="Não" cancelButtonColor="green" [showConfirmButton]="true"
        confirmButtonColor="red" confirmButtonText="Sim" [focusCancel]="true" (confirm)="handleDeactivateAccount()">
    </swal>
    <swal #deleteAccountSwal title="Excluir Conta?" text="Esta ação não pode ser desfeita! Deseja continuar?"
        [showCancelButton]="true" cancelButtonText="Não" cancelButtonColor="green" [showConfirmButton]="true"
        confirmButtonColor="red" confirmButtonText="Sim" [focusCancel]="true" (confirm)="handleDeleteAccount()"></swal>
    <swal #globalLogoutSwal title="Logout Global" text="Todos os dispositivos serão deslogados! Deseja continuar?"
        [showCancelButton]="true" cancelButtonText="Não" cancelButtonColor="green" [showConfirmButton]="true"
        confirmButtonColor="red" confirmButtonText="Sim" [focusCancel]="true" (confirm)="handleGlobalLogout()"></swal>
</div>
