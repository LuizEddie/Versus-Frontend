<div class="p-4 bg-white rounded-lg min-h-screen">
    <app-row>
        <app-col sm="12" class="flex justify-center">
            <img alt="Perfil" class="w-75 h-75 rounded-full border border-gray-300 cursor-pointer"
                [src]="preview || defaultImg" (click)="fileInput.openFileDialog()"/>
        </app-col>
        <app-input #fileInput type="file" accept="image/png, image/jpeg, image/jpg" class="hidden" (fileChange)="onFileSelected($event)"></app-input>
    </app-row>
    <app-row>
        <app-col sm="12">
            <hr>
        </app-col>
        <app-col sm="12">
            <form>
                <app-row>
                    <app-col sm="12">
                        <h1 class="text-2xl mb-2">Dados do Usuário</h1>
                    </app-col>
                    <app-col lg="6">
                        <app-input label="Email" [readOnly]="true"></app-input>
                    </app-col>
                    <app-col lg="6">
                        <app-input label="Nome"></app-input>
                    </app-col>
                    <app-col sm="12">
                        <app-button>Salvar Alterações</app-button>
                    </app-col>
                </app-row>
            </form>
        </app-col>
        <app-col sm="12">
            <hr>
        </app-col>
        <app-col sm="12">
            <app-row>
                <app-col sm="12">
                    <h1 class="text-2xl mb-2">Outras Opções</h1>
                </app-col>
                <app-col sm="6" lg="3">
                    <app-button variant="warning">Logout Global</app-button>
                </app-col>
                <app-col sm="6" lg="3">
                    <app-button variant="warning">Atualizar Senha</app-button>
                </app-col>
                <app-col sm="6" lg="3">
                    <app-button variant="danger">Desativar Conta</app-button>
                </app-col>
                <app-col sm="6" lg="3">
                    <app-button variant="danger">Excluir Conta</app-button>
                </app-col>
            </app-row>
        </app-col>
    </app-row>

</div>
