<form (ngSubmit)="handleForgotPassword()" [formGroup]="formData">
    <app-input label="Email" id="email" name="email" placeholder="Digite o seu email" formControlName="email" [required]="true"></app-input>
    <div class="m-2">
        <app-button type="submit" [disabled]="disableForm">Enviar Email</app-button>
    </div>
    <app-link link="/auth/login">Ir para Login</app-link>
</form>
