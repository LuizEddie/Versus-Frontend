<h1 class="text-2xl">Confirmar Cadastro</h1>
<app-password-form (formSubmit)="handleRegister($event)">
    <div class="m-2">
        <app-button type="submit" [disabled]="disableForm">Finalizar Cadastro</app-button>
    </div>
    @if(showGoToLogin){
    <app-link link="/auth/login">Ir Para Login</app-link>
    }
</app-password-form>
