<h1 class="text-2xl">Bem-Vindo</h1>
<form (ngSubmit)="handleLogin()" [formGroup]="formData">
    <div class="mb-2">
        <app-input label="Email" type="email" placeholder="Digite o seu email" formControlName="email"
            [required]="true"></app-input>
    </div>
    <div class="mb-2">
        <app-input-group formControlName="password" label="Senha" [type]="passwordType" placeholder="Digite a sua senha"
            [required]="true" iconOrText="icon"
            [addonIcon]="passwordType === 'password' ? 'pi pi-eye' : 'pi pi-eye-slash'"
            [inputGroupAddonFunction]="changePasswordInput.bind(this)"></app-input-group>
    </div>
    <div class="m-2">
        <app-button type="submit" [disabled]="disableForm">Entrar</app-button>
    </div>
    <div class="flex flex-row justify-between">
        <app-link link="/auth/register">Cadastrar</app-link>
        <app-link link="/auth/forgot-password">Esqueci a senha</app-link>
    </div>
</form>
