<h1 class="text-2xl">Cadastro</h1>
<form (ngSubmit)="handleRegister()" [formGroup]="formData">
    <div class="mb-2">
        <app-input label="Nome" placeholder="Digite o seu nome" [required]="true" formControlName="name"></app-input>
    </div>
    <div class="mb-2">
        <app-input label="Email" placeholder="Digite o seu email" [required]="true" formControlName="email"></app-input>
    </div>
    <div class="mb-2">
        <app-button type="submit" [disabled]="disableForm">Cadastrar</app-button>
    </div>
    <app-link link="/auth/login">Ir para Login</app-link>
</form>
