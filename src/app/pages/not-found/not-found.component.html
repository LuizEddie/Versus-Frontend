<div class="min-w-full min-h-screen flex flex-col justify-center items-center bg-gray-200">
    <h1 class="text-8xl font-extrabold text-red-600">404</h1>
    <h2 class="text-2xl sm:text-2xl md:text-6xl text-red-400 p-2">Página não encontrada!</h2>
    <h2 class="text-2xl p-2">O que deseja fazer?</h2>
    <div class="flex flex-row p-2">
        @if(store.isLoggedIn()){
            <app-button variant="danger" class="mr-2" routerLink="/home">Voltar para Home</app-button>
        }
        <app-button variant="danger" class="ml-2" routerLink="/auth/login">Voltar para o Login</app-button>
    </div>
</div>
