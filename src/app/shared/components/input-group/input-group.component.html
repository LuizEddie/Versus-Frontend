<div class="flex flex-col text-start w-full">
    <label [for]="id" class="mb-1 text-gray-950 font-medium">{{label}}</label>
    <div class="flex flex-row text-center w-full">
        
        @if(beforeOrAfterInput === 'before'){
            <div class="flex bg-gray-200 rounded-[0.5rem] justify-center items-center text-center w-2/12 cursor-pointer" (click)="inputGroupAddonFunction?.()">
                @if(iconOrText === 'icon'){
                    <i class="pi {{addonIcon}}"></i>
                }

                @if(iconOrText === 'text'){
                    <span>{{addonText}}</span>
                }
            </div>
        }

        <input [type]="type" [id]="id" [name]="name" class="border border-gray-300 bg-white rounded-[0.5rem] p-1 w-10/12" [placeholder]="placeholder" [(ngModel)]="model" (ngModelChange)="modelChange.emit($event)"/>
       
        @if(beforeOrAfterInput === 'after'){
            <div class="flex bg-gray-200 rounded-[0.5rem] justify-center items-center w-2/12 cursor-pointer" (click)="inputGroupAddonFunction?.()">
                @if(iconOrText === 'icon'){
                    <i class="pi {{addonIcon}} text-gray-500"></i>
                }

                @if(iconOrText === 'text'){
                    <span class="text-gray-500">{{addonText}}</span>
                }
            </div>
        }
    </div>
</div>
