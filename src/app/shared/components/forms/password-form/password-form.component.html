<form [formGroup]="formData" (ngSubmit)="onSubmit()">
    <div class="mb-2">
        <app-input-group formControlName="password" label="Senha" [type]="passwordType" placeholder="Digite a sua senha"
            [required]="true" iconOrText="icon"
            [addonIcon]="passwordType === 'password' ? 'pi pi-eye' : 'pi pi-eye-slash'"
            [inputGroupAddonFunction]="changePasswordInput.bind(this)"></app-input-group>
    </div>
    <div class="mb-2">
         <app-input-group formControlName="confirmPassword" label="Confirmar Senha" [type]="confirmPasswordType" placeholder="Confirme a sua senha"
            [required]="true" iconOrText="icon"
            [addonIcon]="confirmPasswordType === 'password' ? 'pi pi-eye' : 'pi pi-eye-slash'"
            [inputGroupAddonFunction]="changeConfirmPasswordInput.bind(this)"></app-input-group>
    </div>
    @if(formData.errors?.['passwordMismatch'] && formData.get('confirmPassword')?.touched){
    <div class="text-sm text-start text-yellow-600 mt-1">
        As senhas não coincidem.
    </div>
    }
    <ng-content></ng-content>
</form>
