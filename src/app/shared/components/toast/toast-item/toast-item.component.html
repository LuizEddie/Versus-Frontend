<div class="px-4 py-2 rounded-lg shadow-md text-white transition-all duration-300 cursor-pointer" [ngClass]="{
                    'bg-green-500': toast.type === 'success',
                    'bg-red-500': toast.type === 'error',
                    'bg-blue-500': toast.type === 'info',
                    'bg-yellow-500': toast.type === 'warning',
                    'bg-orange-500': toast.type === 'loading'
                }" (click)="close()">
    @switch (toast.type) {
    @case ('loading') {
    <span class="text-xl">⏳</span>
    }
    @case('success'){
    <span class="text-xl">✅</span>
    }
    @case('error'){
    <span class="text-xl">❌</span>
    }
    @case('warning'){
    <span class="text-xl">⚠️</span>
    }
    @case('info'){
    <span class="text-xl">ℹ️</span>
    }
    @default(){
    <span class="text-xl">ℹ️</span>
    }
    }
    <span>{{toast.message}}</span>
</div>
