<div class="min-h-screen w-full bg-gray-200 flex flex-col">
    <div class="w-full min-h-13 bg-orange-400 border-b border-b-gray-300 flex flex-row justify-between pl-5 pr-5">
        <ul class="flex list-none justify-center items-center gap-3 cursor-pointer">
            <li routerLink="/home">
                <h1 class="text-2xl text-white inline">Ver</h1>
                <span class="text-2xl">.</span>
                <h1 class="text-2xl text-orange-600 inline">suS</h1>
            </li>
            <li>
                <app-link variant="secondary" link="/home">Home</app-link>
            </li>
            <li>
                <app-link variant="secondary" link="/create-tournament">Criar Torneio</app-link>
            </li>
        </ul>
        <ul class="flex list-none justify-center items-center gap-3 cursor-pointer">
            <app-dropdown [align]="'right'" dropdownType="template" [template]="profileDropdown">
                <app-dropdown-item label="Ver Perfil" [routerLink]="'/profile'"></app-dropdown-item>
                <app-dropdown-item label="Sair" [swal]="logoutSwal"></app-dropdown-item>
            </app-dropdown>
        </ul>
    </div>
    <div class="w-full flex flex-row justify-center flex-1 sm:mt-2">
        <div class="w-full sm:w-[75vw] bg-gray-300 p-2 sm:rounded-lg">
            <router-outlet></router-outlet>
        </div>
    </div>
    <div class="w-full p-2 justify-center text-center bg-white border-t border-t-gray-300 sm:mt-2">
        <p class="text-gray-700"><strong>&copy;Ver.suS</strong></p>
        <p class="text-gray-600 text-sm">Desenvolvido por Luiz Eduardo da Silva Magalhães</p>
    </div>
</div>

<ng-template #profileDropdown>
    <li>
        <img alt="Perfil" class="w-10 h-10 rounded-full" [src]="store.user()?.photoPath || 'profile/default.png'" />
    </li>
</ng-template>

<swal #logoutSwal title="Logout" text="Deseja realmente sair?" [showCancelButton]="true" cancelButtonText="Não"
    [showConfirmButton]="true" confirmButtonText="Sim"
    [focusCancel]="true" (confirm)="logout()"></swal>
